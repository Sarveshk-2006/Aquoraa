name: Aquora CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Seed Test Data & Rasters
        run: |
          python scripts/seed_baseline_rasters.py
          python scripts/seed_critical_facilities.py

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests/ -v


  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Strict TypeScript Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Production Build
        run: |
          cd frontend
          npm run build
